<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 Drill 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .box {
            border: 3px solid black;
            border-radius: 12px;      
            padding: 20px;            
            max-width: 500px;         
            margin: 20px auto;         
            background-color: #ffd665; 
        }
        .btn {
            background-color: #fffb07;
            border: 2px solid #fffb07;
            color: #000;               
            font-weight: bold;      
            padding: 10px 20px;      
            border-radius: 8px;  
}
        #num1{
            text-align: center;
            
        }

        #num2{
            text-align: center;
            
        }
    </style>
</head>
<body>
<div class="box"> <!--<div class="container-fluid bg-light">-->
    <h1 class="text-center text-dark" fst-italic id="h"></h1>
    <h2 class="text-center text-dark" fst-italic id="about">Calculate Cool Stuff</h2>


</div>
<br>

<!-- <button type="button" class="btn btn-warning" onclick="alert(num1);">Calculate</button> -->

<!-- <button type="button" class="btn btn-warning" onclick="document.write(num1);">Calculate</button> -->
<div class="text-center">
<details class="on toggle text-dark">
    <summary><strong>Instructions: "Type in 2 numbers in the boxes below to calculate their sum and product! The first box tells you the sum, and the second shows you the product."</strong></summary>
    <p id="instruct" class="text-center"> </p>
</details>
<br>
<form action="#">
        <label for="num1">Enter first number</label>
        <br>
        <input type="number" id="num1" class="form-control" placeholder="Number" required>
<br>
        <label for="num2">Enter second number</label>
        <br>
        <input type="number" id="num2" class="form-control" placeholder="Number" required>

        <br>
   
<button type="button" class="btn btn-warning" id="btn" onclick="calculate()">Add</button>

<button type="button" class="btn btn-warning" id="btn" onclick="multiply()">Multiply</button>
<br>

    </form>
    
</div>

<p id="result"></p>


<script>
    var h = "Basic Calculator";
 

    document.getElementById('head1').innerHTML = h;

    document.getElementById('instruct').innerHTML = ;

        function calculate(){
           var num1 = document.getElementById('num1').value;
            var num2 = document.getElementById('num2').value;
            var sum = Number(num1)+ Number(num2);
           
            document.getElementById('result').innerHTML = sum;
            
        
        }

        function multiply(){
            var num1 = document.getElementById('num1').value;
            var num2 = document.getElementById('num2').value;
            var prod = Number(num1) * Number(num2);


document.getElementById('result').innerHTML = prod;
        }

        
    </script>
    

</script>
